name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        set:
          - { name: iced, args: "" }
          - { name: teksilo, args: "--no-default-features --features teksilo-ui" }
          - { name: teksilo-mocks, args: "--no-default-features --features teksilo-mocks" }
    name: test (${{ matrix.set.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Linux deps
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libpipewire-0.3-dev libdbus-1-dev libdav1d-dev
          pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb1-dev libx11-dev
      - name: Build
        run: cargo build --verbose ${{ matrix.set.args }}
      - name: Run tests
        run: cargo test --verbose ${{ matrix.set.args }}
