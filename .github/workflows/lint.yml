name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libdbus-1-dev libdav1d-dev
      - name: Clippy
        run: cargo clippy -- -D warnings

  # Pre-existing findings are frozen in tools/clippy-baseline/; new module
  # trees (src/logic, src/frontend, src/teksilo_ui) deny warnings outright.
  clippy-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        set: [default, teksilo-ui, teksilo-mocks]
    name: clippy gate (${{ matrix.set }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install Linux deps
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libpipewire-0.3-dev libdbus-1-dev libdav1d-dev
          pkg-config libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb1-dev libx11-dev
      - name: Clippy gate
        run: python3 tools/clippy_gate.py ${{ matrix.set }}

  # The Teksilo port's documents and catalogues: every Iced stub site is
  # documented, the es-ES / en-US catalogues match each other and the Iced
  # UI's literals, and the parity document covers every Iced message and
  # names only tests that exist.
  port-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stub markers
        run: python3 tools/check_stubs.py
      - name: Locale catalogues
        run: python3 tools/check_locales.py
      - name: Parity document
        run: python3 tools/check_parity.py

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --check
