# API lookup anchor for `cargo teksilo`.
#
# `cargo teksilo` resolves teksilo from the dependency graph of the package it
# runs in, with default features only. In audoxidy, teksilo is an optional
# dependency behind the `teksilo-ui` feature, so the tool cannot see it from the
# repository root. Run `cargo teksilo …` from this directory instead: it depends
# on the same teksilo (and picks up the `[patch.crates-io]` in
# ../../.cargo/config.toml), so lookups answer for the exact version audoxidy
# builds against. Nothing here is compiled into audoxidy.

[package]
name = "teksilo-api"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
teksilo = { version = "0.15.1", features = ["automation", "async"] }

[workspace]
